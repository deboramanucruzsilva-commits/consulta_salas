# Blueprint do Render: cria o serviço web a partir do Dockerfile.
services:
  - type: web
    name: consulta-salas
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL      # cole a URL do banco MySQL (veja GUIA.md)
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_EMAIL       # seu e-mail de administradora
        sync: false
      - key: ADMIN_PASSWORD    # senha inicial (8+ caracteres)
        sync: false
